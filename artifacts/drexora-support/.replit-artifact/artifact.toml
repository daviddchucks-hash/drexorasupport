kind = "web"
previewPath = "/"
title = "Drexora Support"
version = "1.0.0"
id = "artifacts/drexora-support"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24252

[services.development]
run = "pnpm --filter @workspace/drexora-support run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/drexora-support", "run", "build" ]
serve = "static"
publicDir = "artifacts/drexora-support/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24252"
BASE_PATH = "/"
