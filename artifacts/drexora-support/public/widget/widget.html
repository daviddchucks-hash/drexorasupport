<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drexora Support</title>
    <style>
      :root { --primary: #9e92ec; --ink: #29253e; --muted: #77727c; --paper: #fbf9f3; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: transparent; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      #app { position: fixed; right: 0; bottom: 0; width: min(370px, calc(100vw - 24px)); }
      button, input { font: inherit; }
      .launcher { display: grid; place-items: center; width: 58px; height: 58px; margin: 0 0 10px auto; border: 0; border-radius: 19px; background: var(--ink); color: white; box-shadow: 0 14px 32px rgba(41,37,62,.28); cursor: pointer; transition: transform .2s ease; }
      .launcher:hover { transform: translateY(-2px); }
      .panel { overflow: hidden; margin-bottom: 10px; border: 1px solid rgba(41,37,62,.13); border-radius: 24px; background: var(--paper); box-shadow: 0 20px 60px rgba(41,37,62,.22); animation: rise .25s ease both; }
      .header { display: flex; align-items: center; gap: 12px; padding: 18px; background: var(--primary); }
      .avatar { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--ink); color: white; font-size: 12px; font-weight: 800; }
      .heading { font-size: 14px; font-weight: 800; }
      .subheading { margin-top: 3px; color: rgba(41,37,62,.65); font-size: 10px; }
      .close { margin-left: auto; border: 0; background: transparent; color: var(--ink); font-size: 22px; cursor: pointer; }
      .messages { display: grid; gap: 10px; max-height: 360px; overflow: auto; padding: 16px; }
      .bubble { max-width: 85%; padding: 11px 13px; border-radius: 15px; font-size: 12px; line-height: 1.55; }
      .bot { border-top-left-radius: 5px; background: #ebe7f5; }
      .user { margin-left: auto; border-top-right-radius: 5px; background: var(--ink); color: white; }
      .choices { display: grid; gap: 8px; padding: 0 16px 16px; }
      .choice { padding: 11px 12px; border: 1px solid #ddd8cf; border-radius: 12px; background: white; color: var(--ink); text-align: left; font-size: 12px; cursor: pointer; }
      .choice:hover { border-color: var(--primary); }
      .lead-form { display: grid; gap: 8px; padding: 0 16px 16px; }
      .lead-form input { width: 100%; padding: 11px 12px; border: 1px solid #ddd8cf; border-radius: 11px; outline: 0; font-size: 12px; }
      .lead-form input:focus { border-color: var(--primary); }
      .lead-form button { padding: 11px 12px; border: 0; border-radius: 11px; background: var(--ink); color: white; font-size: 12px; font-weight: 700; cursor: pointer; }
      .footer { padding: 11px; border-top: 1px solid #e8e3da; color: #9b969e; text-align: center; font-size: 9px; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @media (max-width: 460px) { #app { right: 12px; width: calc(100vw - 24px); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script>
      (function () {
        var config = {
          apiKey: 'AIzaSyA1wX_0tastbk_hWfI0_cvuV9ZzoIKitL4',
          authDomain: 'drexorasupport.firebaseapp.com',
          projectId: 'drexorasupport',
          storageBucket: 'drexorasupport.firebasestorage.app',
          messagingSenderId: '669148105903',
          appId: '1:669148105903:web:69641657318107bf1a185a'
        };
        var businessId = new URLSearchParams(window.location.search).get('business');
        var state = { open: false, settings: { primaryColor: '#9e92ec', chatTitle: 'Nova from Drexora', welcomeMessage: 'Hi there. I can help with orders, plans, or finding the right fit.' }, faqs: [], messages: [] };
        var root = document.getElementById('app');

        try {
          firebase.initializeApp(config);
          var db = firebase.firestore();
          db.collection('Settings').doc(businessId).get().then(function (snapshot) {
            if (snapshot.exists) state.settings = Object.assign(state.settings, snapshot.data());
            return db.collection('FAQs').where('businessId', '==', businessId).get();
          }).then(function (snapshot) {
            if (snapshot) state.faqs = snapshot.docs.map(function (doc) { return doc.data(); });
            render();
          }).catch(function () { render(); });
        } catch (error) { render(); }

        function notify() { window.parent.postMessage({ type: 'drexora-widget-resize', open: state.open }, '*'); }
        function answer(question) {
          state.messages.push({ role: 'user', text: question });
          var normalized = question.toLowerCase();
          var match = state.faqs.find(function (faq) { return normalized.includes(String(faq.question || '').toLowerCase().split(' ').slice(0, 3).join(' ')); });
          if (match) state.messages.push({ role: 'bot', text: match.answer });
          else state.messages.push({ role: 'bot', text: 'I couldn’t find that information. Please leave your name, email and phone number and our team will contact you.', lead: true });
          render();
        }
        function saveLead(event) {
          event.preventDefault();
          var form = event.target;
          var payload = { businessId: businessId, name: form.name.value, email: form.email.value, phone: form.phone.value, source: 'widget', createdAt: firebase.firestore.FieldValue.serverTimestamp() };
          firebase.firestore().collection('Leads').add(payload).catch(function () {});
          state.messages.push({ role: 'bot', text: 'Thanks — your details are with the team. Someone will be in touch soon.' });
          render();
        }
        function render() {
          document.documentElement.style.setProperty('--primary', state.settings.primaryColor || '#9e92ec');
          root.innerHTML = state.open ? '<div class="panel"><div class="header"><span class="avatar">dx</span><div><div class="heading">' + escapeHtml(state.settings.chatTitle) + '</div><div class="subheading">Usually replies instantly</div></div><button class="close" id="close" aria-label="Close widget">×</button></div><div class="messages"><div class="bubble bot">' + escapeHtml(state.settings.welcomeMessage) + '</div>' + state.messages.map(function (message) { return '<div class="bubble ' + message.role + '">' + escapeHtml(message.text) + '</div>' + (message.lead ? '<form class="lead-form" id="lead-form"><input name="name" required placeholder="Your name"><input name="email" type="email" required placeholder="Email address"><input name="phone" placeholder="Phone number"><button>Send details</button></form>' : ''); }).join('') + '</div><div class="choices"><button class="choice" data-question="Tell me about plans">Tell me about plans</button><button class="choice" data-question="Where is my order?">Where is my order?</button></div><div class="footer">Powered by Drexora Support</div></div>' : '';
          root.innerHTML += '<button class="launcher" id="launcher" aria-label="' + (state.open ? 'Close' : 'Open') + ' support widget">' + (state.open ? '×' : '✦') + '</button>';
          document.getElementById('launcher').onclick = function () { state.open = !state.open; notify(); render(); };
          if (state.open) {
            document.getElementById('close').onclick = function () { state.open = false; notify(); render(); };
            Array.prototype.forEach.call(document.querySelectorAll('[data-question]'), function (button) { button.onclick = function () { answer(button.getAttribute('data-question')); }; });
            var form = document.getElementById('lead-form');
            if (form) form.onsubmit = saveLead;
          }
          notify();
        }
        function escapeHtml(value) { return String(value || '').replace(/[&<>"']/g, function (char) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char]; }); }
      }());
    </script>
  </body>
</html>
