<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversations — Drexora Support</title>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=5">
  <link rel="stylesheet" href="css/team-tickets.css?v=2">
  <script>(function(){if(localStorage.getItem('drexora-theme')==='dark')document.documentElement.classList.add('dark-mode');}());</script>
  <style>
    .chat-layout { display:flex; height:100vh; overflow:hidden; }
    .chat-list-col { width:320px; flex-shrink:0; border-right:1px solid var(--border); overflow:hidden; display:flex; flex-direction:column; background:var(--surface); }
    .chat-detail-col { flex:1; overflow:hidden; display:flex; flex-direction:column; }
    .filter-bar { display:flex; gap:4px; padding:8px 10px; border-bottom:1px solid var(--border); overflow-x:auto; background:var(--surface-raised); flex-shrink:0; }
    .filter-bar::-webkit-scrollbar { height:3px; }
    .filter-btn { padding:5px 12px; border-radius:99px; font-size:.75rem; font-weight:600; border:1px solid var(--border); background:transparent; cursor:pointer; color:var(--text-secondary); white-space:nowrap; transition:all .15s; }
    .filter-btn:hover { border-color:var(--primary-light); color:var(--text-primary); }
    .filter-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    @media (max-width:768px) {
      .chat-list-col { width:100%; border-right:none; height:280px; flex-shrink:0; }
      .chat-layout { flex-direction:column; }
    }
  </style>
</head>
<body>
  <div class="page-bg"></div>
  <button class="sidebar-toggle" aria-label="Toggle menu">☰</button>
  <div class="sidebar-overlay"></div>

  <div class="app-layout">

    <!-- ── Sidebar ──────────────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <img src="images/logo.png" alt="Drexora" class="sidebar-logo-img">
        <div class="sidebar-logo-text">Drexora <span>Support</span></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a class="nav-item" href="dashboard.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a class="nav-item" href="knowledge-base.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Knowledge Base
        </a>
        <a class="nav-item" href="leads.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Leads
        </a>
        <a class="nav-item active" href="chats.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Chats
        </a>
        <a class="nav-item" href="inbox.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          Team Inbox
          <span class="nav-badge" id="inbox-badge" style="display:none"></span>
        </a>
        <a class="nav-item" href="workspace.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          Workspace
          <span class="nav-badge" id="workspace-badge" style="display:none"></span>
        </a>
        <a class="nav-item" href="team.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Team
        </a>
        <a class="nav-item" href="tickets.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 0 0-2 2v3a2 2 0 1 1 0 4v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3a2 2 0 1 1 0-4V7a2 2 0 0 0-2-2H5z"/></svg>
          Tickets
        </a>
        <div class="nav-section-label">Account</div>
        <a class="nav-item" href="settings.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" id="sidebar-user-avatar"></div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-user-name">Loading…</div>
            <div class="sidebar-user-email" id="sidebar-user-email"></div>
          </div>
          <button class="btn btn-ghost btn-sm logout-btn" data-logout title="Sign out" style="padding:6px 10px;font-size:.75rem">↩</button>
        </div>
      </div>
    </aside>

    <!-- ── Main Content ──────────────────────────────────────── -->
    <main class="main-content" style="padding:0;overflow:hidden;display:flex;flex-direction:column">

      <!-- Topbar -->
      <header class="topbar" style="flex-shrink:0">
        <div>
          <div class="topbar-title">Conversations</div>
          <div class="topbar-subtitle"><span id="chat-count">0</span> total</div>
        </div>
        <div class="topbar-actions">
          <button class="theme-toggle">
            <span class="theme-toggle-icon">🌙</span>
            <span class="theme-toggle-label">Dark</span>
          </button>
          <div style="position:relative">
            <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-muted);pointer-events:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input class="form-input" type="text" id="chat-search" placeholder="Search…" style="padding-left:32px;width:200px;font-size:.83rem">
          </div>
        </div>
      </header>

      <!-- Chat layout -->
      <div class="chat-layout" style="flex:1">

        <!-- Left: list + filters -->
        <div class="chat-list-col">
          <!-- Filter tabs -->
          <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="mine">Mine</button>
            <button class="filter-btn" data-filter="waiting_for_agent">Waiting</button>
            <button class="filter-btn" data-filter="assigned">Assigned</button>
            <button class="filter-btn" data-filter="resolved">Resolved</button>
            <button class="filter-btn" data-filter="closed">Closed</button>
          </div>
          <!-- List -->
          <div id="chat-list" style="flex:1;overflow-y:auto">
            <div style="text-align:center;padding:60px">
              <div class="spinner" style="margin:0 auto"></div>
            </div>
          </div>
        </div>

        <!-- Right: detail -->
        <div id="chat-detail" class="chat-detail-col">
          <div class="empty-state" style="margin:auto">
            <div class="empty-state-icon">💬</div>
            <div class="empty-state-title">Select a conversation</div>
            <div class="empty-state-desc">Choose a chat from the left to view the full conversation.</div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/chats.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
