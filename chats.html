<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chats — Drexora Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=3">
  <script>
    (function(){if(localStorage.getItem('drexora-theme')==='dark')document.documentElement.classList.add('dark-mode');})();
  </script>
</head>
<body>
  <div class="page-bg"></div>
  <button class="sidebar-toggle" aria-label="Toggle menu">☰</button>
  <div class="sidebar-overlay"></div>

  <div class="app-layout">

    <!-- ── Sidebar ──────────────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <img src="images/logo.png" alt="Drexora" class="sidebar-logo-img">
        <div class="sidebar-logo-text">Drexora <span>Support</span></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a class="nav-item" href="dashboard.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a class="nav-item" href="knowledge-base.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Knowledge Base
        </a>
        <a class="nav-item" href="leads.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Leads
        </a>
        <a class="nav-item active" href="chats.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Chats
        </a>
        <div class="nav-section-label">Account</div>
        <a class="nav-item" href="settings.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-avatar" data-user-avatar></div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" data-user-name>Loading…</div>
            <div class="sidebar-user-role" data-user-email></div>
          </div>
          <button class="sidebar-logout" data-logout title="Sign out">→</button>
        </div>
      </div>
    </aside>

    <!-- ── Main Content ──────────────────────────────────────── -->
    <main class="main-content">
      <header class="topbar">
        <div>
          <div class="topbar-title">Conversations</div>
          <div class="topbar-subtitle"><span id="chat-count">0</span> total conversations</div>
        </div>
        <div class="topbar-actions">
          <button class="theme-toggle" aria-label="Switch to dark mode">
          <span class="theme-toggle-icon">🌙</span>
          <span class="theme-toggle-label">Dark</span>
        </button>
          <div class="search-wrap" style="max-width:240px">
            <span class="search-icon">🔍</span>
            <input class="search-input" type="text" id="chat-search" placeholder="Search conversations…">
          </div>
        </div>
      </header>

      <div class="page-body" style="padding:0;display:flex;flex:1;overflow:hidden;height:calc(100vh - 73px)">

        <!-- Left panel — chat list -->
        <div id="chat-list" style="
          width:320px;
          flex-shrink:0;
          border-right:1px solid var(--glass-border);
          overflow-y:auto;
          background:rgba(10,6,20,.5)
        ">
          <div style="text-align:center;padding:60px">
            <div class="spinner" style="margin:0 auto"></div>
          </div>
        </div>

        <!-- Right panel — chat detail -->
        <div id="chat-detail" style="flex:1;overflow:hidden;display:flex;flex-direction:column">
          <div class="empty-state">
            <div class="empty-state-icon">💬</div>
            <div class="empty-state-title">Select a conversation</div>
            <div class="empty-state-desc">Choose a chat from the left to view the full conversation.</div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/chats.js"></script>

  <style>
    /* ── Agent reply bar ───────────────────────────────────────── */
    .agent-reply-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid var(--glass-border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .agent-reply-input {
      flex: 1;
      background: var(--input-bg);
      border: 1.5px solid var(--glass-border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: .85rem;
      color: var(--text-primary);
      outline: none;
      transition: border-color .15s, background .15s;
      font-family: inherit;
    }
    .agent-reply-input:focus {
      border-color: var(--primary);
      background: var(--surface);
    }
    .agent-reply-input::placeholder { color: var(--text-muted); }
    .agent-reply-input:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    .agent-reply-send {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: var(--primary);
      color: var(--text-on-primary);
      border: none;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: opacity .15s, transform .1s;
    }
    .agent-reply-send:hover:not(:disabled)  { opacity: .88; transform: scale(1.04); }
    .agent-reply-send:active:not(:disabled) { transform: scale(.96); }
    .agent-reply-send:disabled { opacity: .4; cursor: not-allowed; }

    /* Agent message bubble */
    .msg.agent { justify-content: flex-end; }
    .msg.agent .msg-bubble {
      background: var(--primary);
      color: var(--text-on-primary);
      border-radius: 14px 14px 4px 14px;
    }
    .msg.agent .msg-time { text-align: right; }
    .agent-label {
      font-weight: 600;
      color: var(--primary);
      font-size: .7rem;
    }

    @media (max-width: 768px) {
      #chat-list  { width: 100%; border-right: none; height: 260px; flex-shrink: 0; }
      .page-body  { flex-direction: column !important; height: auto !important; overflow: visible !important; }
      #chat-detail { min-height: 400px; }
    }
  </style>
  <script src="js/theme.js"></script>
</body>
</html>
