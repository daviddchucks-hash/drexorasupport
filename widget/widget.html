<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drexora Support</title>
  <style>
    :root{--primary:#9e92ec;--ink:#29253e;--paper:#fbf9f3}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:transparent;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}#app{position:fixed;right:0;bottom:0;width:min(370px,calc(100vw - 24px))}button,input{font:inherit}.launcher{display:grid;place-items:center;width:58px;height:58px;margin:0 0 10px auto;border:0;border-radius:19px;background:var(--ink);color:#fff;box-shadow:0 14px 32px rgba(41,37,62,.28);cursor:pointer}.panel{overflow:hidden;margin-bottom:10px;border:1px solid rgba(41,37,62,.13);border-radius:24px;background:var(--paper);box-shadow:0 20px 60px rgba(41,37,62,.22)}.header{display:flex;align-items:center;gap:12px;padding:18px;background:var(--primary)}.avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--ink);color:white;font-size:12px;font-weight:800}.heading{font-size:14px;font-weight:800}.subheading{margin-top:3px;color:rgba(41,37,62,.65);font-size:10px}.close{margin-left:auto;border:0;background:transparent;color:var(--ink);font-size:22px;cursor:pointer}.messages{display:grid;gap:10px;max-height:360px;overflow:auto;padding:16px}.bubble{max-width:85%;padding:11px 13px;border-radius:15px;font-size:12px;line-height:1.55}.bot{border-top-left-radius:5px;background:#ebe7f5}.user{margin-left:auto;border-top-right-radius:5px;background:var(--ink);color:white}.choices{display:grid;gap:8px;padding:0 16px 16px}.choice{padding:11px 12px;border:1px solid #ddd8cf;border-radius:12px;background:white;color:var(--ink);text-align:left;font-size:12px;cursor:pointer}.lead-form{display:grid;gap:8px;padding:0 16px 16px}.lead-form input{width:100%;padding:11px 12px;border:1px solid #ddd8cf;border-radius:11px;outline:0;font-size:12px}.lead-form button{padding:11px 12px;border:0;border-radius:11px;background:var(--ink);color:white;font-size:12px;font-weight:700;cursor:pointer}.footer{padding:11px;border-top:1px solid #e8e3da;color:#9b969e;text-align:center;font-size:9px}@media(max-width:460px){#app{right:12px;width:calc(100vw - 24px)}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
  (function(){
    var config={apiKey:'AIzaSyA1wX_0tastbk_hWfI0_cvuV9ZzoIKitL4',authDomain:'drexorasupport.firebaseapp.com',projectId:'drexorasupport',storageBucket:'drexorasupport.firebasestorage.app',messagingSenderId:'669148105903',appId:'1:669148105903:web:69641657318107bf1a185a'};
    var businessId=new URLSearchParams(location.search).get('business'),state={open:false,settings:{primaryColor:'#9e92ec',chatTitle:'Nova from Drexora',welcomeMessage:'Hi there. I can help with orders, plans, or finding the right fit.'},faqs:[],messages:[]},root=document.getElementById('app');
    try{firebase.initializeApp(config);var db=firebase.firestore();db.collection('Settings').doc(businessId).get().then(function(s){if(s.exists)state.settings=Object.assign(state.settings,s.data());return db.collection('FAQs').where('businessId','==',businessId).get()}).then(function(s){if(s)state.faqs=s.docs.map(function(d){return d.data()});render()}).catch(render)}catch(e){render()}
    function msg(){parent.postMessage({type:'drexora-widget-resize',open:state.open},'*')}
    function answer(q){state.messages.push({role:'user',text:q});var n=q.toLowerCase(),m=state.faqs.find(function(f){return n.includes(String(f.question||'').toLowerCase().split(' ').slice(0,3).join(' '))});state.messages.push(m?{role:'bot',text:m.answer}:{role:'bot',text:'I couldn’t find that information. Please leave your name, email and phone number and our team will contact you.',lead:true});render()}
    function lead(e){e.preventDefault();var f=e.target;firebase.firestore().collection('Leads').add({businessId:businessId,name:f.name.value,email:f.email.value,phone:f.phone.value,source:'widget',createdAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(){});state.messages.push({role:'bot',text:'Thanks — your details are with the team. Someone will be in touch soon.'});render()}
    function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]})}
    function render(){document.documentElement.style.setProperty('--primary',state.settings.primaryColor||'#9e92ec');root.innerHTML=state.open?'<div class="panel"><div class="header"><span class="avatar">dx</span><div><div class="heading">'+esc(state.settings.chatTitle)+'</div><div class="subheading">Usually replies instantly</div></div><button class="close" id="close">×</button></div><div class="messages"><div class="bubble bot">'+esc(state.settings.welcomeMessage)+'</div>'+state.messages.map(function(m){return '<div class="bubble '+m.role+'">'+esc(m.text)+'</div>'+(m.lead?'<form class="lead-form" id="lead-form"><input name="name" required placeholder="Your name"><input name="email" type="email" required placeholder="Email address"><input name="phone" placeholder="Phone number"><button>Send details</button></form>':'')}).join('')+'</div><div class="choices"><button class="choice" data-q="Tell me about plans">Tell me about plans</button><button class="choice" data-q="Where is my order?">Where is my order?</button></div><div class="footer">Powered by Drexora Support</div></div>':'';root.innerHTML+='<button class="launcher" id="launcher">'+(state.open?'×':'✦')+'</button>';document.getElementById('launcher').onclick=function(){state.open=!state.open;msg();render()};if(state.open){document.getElementById('close').onclick=function(){state.open=false;msg();render()};Array.prototype.forEach.call(document.querySelectorAll('[data-q]'),function(b){b.onclick=function(){answer(b.getAttribute('data-q'))}});var f=document.getElementById('lead-form');if(f)f.onsubmit=lead}msg()}
  }());
  </script>
</body>
</html>
