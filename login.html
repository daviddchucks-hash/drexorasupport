<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Drexora Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=4">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    (function(){if(localStorage.getItem('drexora-theme')==='dark')document.documentElement.classList.add('dark-mode');})();
  </script>
</head>
<body class="landing-body">
  <div style="position:fixed;top:18px;right:20px;z-index:300">
    <button class="theme-toggle" aria-label="Switch to dark mode">
      <span class="theme-toggle-icon">🌙</span>
      <span class="theme-toggle-label">Dark</span>
    </button>
  </div>
  <div class="page-bg"></div>

  <div class="auth-page">
    <div class="auth-card animate-fadeUp">

      <!-- Logo -->
      <div class="auth-logo">
        <img src="images/logo.png" alt="Drexora" class="auth-logo-img">
        <span class="auth-logo-text">Drexora <strong>Support</strong></span>
      </div>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to manage your support widget and leads.</p>

      <!-- Error message -->
      <div id="error-msg" style="
        display:none;
        background:rgba(239,68,68,.1);
        border:1px solid rgba(239,68,68,.3);
        border-radius:8px;
        padding:12px 14px;
        font-size:.875rem;
        color:#fca5a5;
        margin-bottom:16px;
      "></div>

      <!-- Login form -->
      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-input" type="email" id="email" placeholder="you@business.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div style="position:relative">
            <input class="form-input" type="password" id="password" placeholder="Your password" required autocomplete="current-password" style="padding-right:44px">
            <button type="button" id="toggle-password" style="
              position:absolute;right:12px;top:50%;transform:translateY(-50%);
              background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;padding:0
            ">👁</button>
          </div>
        </div>

        <div style="text-align:right;margin-bottom:20px;margin-top:-8px">
          <a href="#" style="font-size:.8rem;color:var(--primary-light)" onclick="forgotPassword(event)">Forgot password?</a>
        </div>

        <button class="btn btn-primary btn-block" type="submit" id="btn-submit">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one free</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Firebase CDN SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/login.js"></script>

  <script>
    function forgotPassword(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) {
        document.getElementById('error-msg').textContent = 'Enter your email above first, then click Forgot password.';
        document.getElementById('error-msg').style.display = 'block';
        return;
      }
      firebase.auth().sendPasswordResetEmail(email).then(() => {
        document.getElementById('error-msg').style.display = 'none';
        alert('Password reset email sent! Check your inbox.');
      }).catch(err => {
        document.getElementById('error-msg').textContent = err.message;
        document.getElementById('error-msg').style.display = 'block';
      });
    }
  </script>
  <script src="js/theme.js"></script>
</body>
</html>
