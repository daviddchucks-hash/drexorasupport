<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Inbox — Drexora Support</title>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=5">
  <link rel="stylesheet" href="css/team-tickets.css?v=2">
  <script>(function(){if(localStorage.getItem('drexora-theme')==='dark')document.documentElement.classList.add('dark-mode');}());</script>
  <style>
    /* Inbox-specific layout */
    .inbox-layout {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .inbox-sidebar {
      width: 260px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: var(--surface-raised);
      overflow: hidden;
    }
    .inbox-main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .inbox-list-panel {
      width: 340px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
    }
    .inbox-detail-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
    }
    .inbox-filter-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      transition: all .15s;
      width: 100%;
      text-align: left;
    }
    .inbox-filter-btn:hover { background: var(--glass-hover); color: var(--text-primary); }
    .inbox-filter-btn.active {
      background: rgba(201,162,39,.1);
      color: var(--primary);
    }
    .inbox-count-badge {
      background: var(--glass-active);
      color: var(--text-muted);
      font-size: .7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      min-width: 20px;
      text-align: center;
    }
    .inbox-filter-btn.active .inbox-count-badge {
      background: var(--primary);
      color: #fff;
    }
    .inbox-item { transition: background .12s; }
    .inbox-item:hover { background: var(--glass-hover) !important; }
    .inbox-item.selected { background: rgba(201,162,39,.08) !important; }
    .inbox-item--urgent { border-left: 3px solid var(--primary) !important; }
    @media (max-width: 900px) {
      .inbox-sidebar { display: none; }
      .inbox-list-panel { width: 100%; }
      .inbox-detail-panel { display: none; }
      .inbox-detail-panel.open { display: flex; position: fixed; inset: 0; z-index: 200; }
    }
  </style>
</head>
<body>
  <div class="page-bg"></div>
  <button class="sidebar-toggle" aria-label="Toggle menu">☰</button>
  <div class="sidebar-overlay"></div>

  <div class="app-layout">

    <!-- ── App Sidebar ──────────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <img src="images/logo.png" alt="Drexora" class="sidebar-logo-img">
        <div class="sidebar-logo-text">Drexora <span>Support</span></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a class="nav-item" href="dashboard.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a class="nav-item" href="knowledge-base.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Knowledge Base
        </a>
        <a class="nav-item" href="leads.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Leads
        </a>
        <a class="nav-item" href="chats.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Chats
        </a>
        <a class="nav-item active" href="inbox.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          Team Inbox
          <span class="nav-badge" id="inbox-badge" style="display:none"></span>
        </a>
        <a class="nav-item" href="workspace.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          Workspace
          <span class="nav-badge" id="workspace-badge" style="display:none"></span>
        </a>
        <a class="nav-item" href="team.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Team
        </a>
        <a class="nav-item" href="tickets.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 0 0-2 2v3a2 2 0 1 1 0 4v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3a2 2 0 1 1 0-4V7a2 2 0 0 0-2-2H5z"/></svg>
          Tickets
        </a>
        <div class="nav-section-label">Account</div>
        <a class="nav-item" href="settings.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" id="sidebar-user-avatar"></div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-user-name">Loading…</div>
            <div class="sidebar-user-email" id="sidebar-user-email"></div>
          </div>
          <button class="btn btn-ghost btn-sm logout-btn" title="Sign out" data-logout style="padding:6px 10px;font-size:.75rem">↩</button>
        </div>
      </div>
    </aside>

    <!-- ── Main content ──────────────────────────────────────── -->
    <main class="main-content" style="padding:0;overflow:hidden;display:flex;flex-direction:column">

      <!-- Inbox layout -->
      <div class="inbox-main" style="flex:1;overflow:hidden">

        <!-- Left: filter list -->
        <div class="inbox-list-panel">
          <!-- Search bar -->
          <div style="padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface)">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
              <div style="font-size:1rem;font-weight:700;color:var(--text-primary)">Team Inbox</div>
            </div>
            <div style="position:relative">
              <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-muted)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="inbox-search" placeholder="Search conversations…"
                     style="width:100%;padding:8px 12px 8px 32px;background:var(--input-bg);border:1px solid var(--border);
                            border-radius:8px;color:var(--text-primary);font-size:.83rem;outline:none;
                            transition:border-color .15s">
            </div>
          </div>

          <!-- Filters -->
          <div style="padding:8px 10px;border-bottom:1px solid var(--border);background:var(--surface-raised)">
            <button class="inbox-filter-btn active" data-filter="all">
              <span>📬 All Conversations</span>
              <span class="inbox-count-badge" id="count-all">0</span>
            </button>
            <button class="inbox-filter-btn" data-filter="mine">
              <span>👤 My Conversations</span>
              <span class="inbox-count-badge" id="count-mine">0</span>
            </button>
            <button class="inbox-filter-btn" data-filter="waiting">
              <span>⏳ Waiting for Agent</span>
              <span class="inbox-count-badge" id="count-waiting">0</span>
            </button>
            <button class="inbox-filter-btn" data-filter="assigned">
              <span>💬 Assigned</span>
              <span class="inbox-count-badge" id="count-assigned">0</span>
            </button>
            <button class="inbox-filter-btn" data-filter="resolved">
              <span>✅ Resolved</span>
              <span class="inbox-count-badge" id="count-resolved">0</span>
            </button>
            <button class="inbox-filter-btn" data-filter="closed">
              <span>🔒 Closed</span>
              <span class="inbox-count-badge" id="count-closed">0</span>
            </button>
          </div>

          <!-- Conversation list -->
          <div id="inbox-list" style="flex:1;overflow-y:auto">
            <div style="display:flex;align-items:center;justify-content:center;padding:60px 24px;color:var(--text-muted)">
              <div class="spinner"></div>
            </div>
          </div>
        </div>

        <!-- Right: detail panel -->
        <div class="inbox-detail-panel" id="inbox-detail">
          <div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px;color:var(--text-muted)">
            <div style="font-size:3rem">📬</div>
            <div style="font-size:1rem;font-weight:600">Select a conversation</div>
            <div style="font-size:.85rem">Choose one from the list to view and reply.</div>
          </div>
        </div>

      </div><!-- /inbox-main -->
    </main>
  </div><!-- /app-layout -->

  <div id="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/inbox.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
